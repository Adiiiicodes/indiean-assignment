name: focusdesk
description: "FocusDesk - focus-session task manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dio: ^5.11.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.6
  just_audio: ^0.10.6
  video_player: ^2.14.1
  chewie: ^1.17.2
  intl: ^0.20.3
  uuid: ^4.6.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  integration_test:
    sdk: flutter

flutter:

  uses-material-design: true
  assets:
    - assets/audio/fallback.mp3
    - assets/video/fallback.mp4
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_icon.png
  adaptive_icon_background: assets/images/app_icon_background.png
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: '#FFFBFF'
  color_dark: '#15121D'
  image: assets/images/splash_icon.png
  image_dark: assets/images/splash_icon.png
  android_gravity: center
  fullscreen: false
  android_12:
    color: '#FFFBFF'
    color_dark: '#15121D'
    image: assets/images/splash_android12.png
    image_dark: assets/images/splash_android12.png
    icon_background_color: '#7353BA'
    icon_background_color_dark: '#7353BA'

